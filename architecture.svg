<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ED1C24"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" letter-spacing="1">ROCM KERNEL TUNER</text>
  <text x="450" y="68" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="3">FINE-TUNING PIPELINE</text>

  <!-- Corpus Ingest -->
  <rect x="20" y="120" width="160" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="20" y="120" width="160" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="100" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">CORPUS</text>
  <text x="100" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Code + Kernel DB</text>
  <rect x="45" y="190" width="110" height="55" fill="#111" stroke="#333" stroke-width="1" rx="6"/>
  <rect x="52" y="198" width="96" height="6" fill="#ED1C24" opacity="0.4" rx="3"/>
  <rect x="52" y="208" width="65" height="6" fill="#ED1C24" opacity="0.25" rx="3"/>
  <rect x="52" y="218" width="85" height="6" fill="#ED1C24" opacity="0.35" rx="3"/>
  <rect x="52" y="228" width="50" height="6" fill="#ED1C24" opacity="0.2" rx="3"/>

  <line x1="180" y1="190" x2="220" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Training on MI300X -->
  <rect x="230" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="230" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="315" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">TRAINING</text>
  <text x="315" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Llama / Mistral SFT</text>
  <rect x="250" y="190" width="130" height="55" fill="#111" stroke="#ED1C24" stroke-width="1.5" rx="6"/>
  <text x="315" y="215" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">AMD MI300X</text>
  <rect x="260" y="228" width="110" height="4" fill="#ED1C24" opacity="0.6" rx="2"/>
  <rect x="260" y="235" width="80" height="4" fill="#ED1C24" opacity="0.4" rx="2"/>
  <text x="315" y="250" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">ROCm / HIP</text>

  <line x1="400" y1="190" x2="440" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Evaluation -->
  <rect x="450" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="450" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="535" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">EVALUATION</text>
  <text x="535" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Pass@k + Kernel Perf</text>
  <polyline points="470,240 490,225 510,220 530,205 550,200 570,185 590,175" fill="none" stroke="#ED1C24" stroke-width="2"/>
  <circle cx="470" cy="240" r="3" fill="#ED1C24"/>
  <circle cx="530" cy="220" r="3" fill="#ED1C24"/>
  <circle cx="590" cy="175" r="3" fill="#ED1C24"/>
  <text x="535" y="252" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">Pass@1 trending up</text>

  <line x1="620" y1="190" x2="660" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Inference / Deployment -->
  <rect x="670" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="670" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="755" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">INFERENCE</text>
  <text x="755" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">HF Space / ONNX</text>
  <rect x="690" y="190" width="130" height="55" fill="#111" stroke="#ED1C24" stroke-width="1.5" rx="6"/>
  <text x="755" y="215" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">HF Space</text>
  <rect x="700" y="228" width="110" height="4" fill="#ED1C24" opacity="0.6" rx="2"/>
  <rect x="700" y="235" width="90" height="4" fill="#ED1C24" opacity="0.4" rx="2"/>
  <text x="755" y="250" text-anchor="middle" fill="#888" font-family="JetBrains Mono, monospace" font-size="8">Live demo endpoint</text>

  <!-- Bottom Metrics -->
  <rect x="80" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="180" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">2.5x</text>
  <text x="180" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">SPEEDUP vs BASELINE</text>

  <rect x="310" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="410" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">MI300X</text>
  <text x="410" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">ROCm TRAINING BACKEND</text>

  <rect x="540" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="640" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">LIVE</text>
  <text x="640" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">HF SPACE DEPLOYMENT</text>

  <!-- Footer -->
  <text x="450" y="400" text-anchor="middle" fill="#444" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">AMD MI300X + ROCm | XMRT DAO</text>
</svg>
